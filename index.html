<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Euforia</title>

    <style>
        body {
    margin: 0;
    min-height: 100vh;
    background-image: url("fundo3.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Colour Me Purple;
        }

        .pagina {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }

        .imagem-principal {
            width: min(60vw, 400px);
            height: min(107vw, 711px);
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }

        .texto {
            margin-top: 30px;
            color: black;
            font-size: 22px;
            line-height: 1.6;
        }

        audio {
            display: none;
        }

        .hidden {
            display: none;
            color: yellow;
        }
    </style>
</head>

<body>

    <main class="pagina">

        <img
            class="imagem-principal"
            src="euforia.png"
            alt="Imagem principal"
        >

        <p class="texto">
       Meu amor, aqui está o seu prêmio da segunda carta, mas o sexto enigma ainda precisa ser descoberto.
            Por favor, chegando nesse ponto, me avise para eu poder te entregar a terceira.
            Se prepare.
        </p>

        <audio id="musica" autoplay loop>
            <source src="Alinhamento Milenar.mp3" type="audio/mpeg">
        </audio>

        
    <span class="hidden"> 
        Você tem o que é necessário, mas não vai saber o que, ainda.
        
    <script>
        const musica = document.getElementById("musica");

        musica.volume = 1.0;

        function iniciarMusica() {
            musica.play().catch(() => {});
        }

        iniciarMusica();

        document.addEventListener("click", iniciarMusica, { once: true });
        document.addEventListener("touchstart", iniciarMusica, { once: true });
        document.addEventListener("keydown", iniciarMusica, { once: true });
    </script>

</body>

    </html>
